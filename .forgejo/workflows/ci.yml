name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: native
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Flake check
        run: nix flake check --no-build
  build:
    needs: check
    runs-on: native
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build checks
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -- --flake ".#checks.x86_64-linux" --skip-cached --no-nom \
            --eval-workers 2 --eval-max-memory-size 8192
          if [ "$EVENT" = push ]; then
            mkdir -p /var/lib/gitea-runner/gcroots
            set -- "$@" --out-link /var/lib/gitea-runner/gcroots/result
          fi
          nix run nixpkgs#nix-fast-build -- "$@"
  notify:
    if: ${{ failure() && github.event_name == 'push' }}
    needs: [check, build]
    runs-on: native
    timeout-minutes: 5
    steps:
      - name: Notify failure
        env:
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
        run: |
          curl -fsS -H "Authorization: Bearer $NTFY_TOKEN" \
            -H "Title: CI failed: $REPO" -H "Priority: high" -H "Tags: x" \
            -d "$SHA: $RUN_URL" \
            "https://ntfy.deku.moe/nix-ci"
