name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: native
    timeout-minutes: 15
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Formatting and static analysis
        run: |
          set -euo pipefail
          nix fmt -- --ci
      - name: CI script checks
        run: |
          set -euo pipefail
          nix develop .#ci --command bash -c 'shellcheck scripts/ci-*.sh scripts/test-ci.sh && bash scripts/test-ci.sh'
      - name: Flake check
        run: |
          set -euo pipefail
          nix flake check --no-build
  build:
    needs: check
    runs-on: native
    timeout-minutes: 120
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build checks
        env:
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          nix develop .#ci --command bash scripts/ci-build.sh
  notify:
    if: ${{ failure() && !cancelled() && github.event_name == 'push' }}
    needs: [check, build]
    runs-on: native
    timeout-minutes: 5
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Notify failure
        env:
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
        run: bash scripts/ci-notify.sh
