name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
jobs:
  check:
    runs-on: native
    env:
      BUMP: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - name: Update flake inputs
        if: env.BUMP == 'true'
        run: nix flake update
      - name: Format check
        run: nix fmt -- --ci
      - name: Flake check
        run: nix flake check --no-build
      - name: Commit and push flake.lock
        if: env.BUMP == 'true'
        run: |
          if git diff --quiet flake.lock; then
            echo "flake.lock is already up to date"
            exit 0
          fi
          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@noreply.deku.moe"
          git commit -m "chore: update flake.lock" flake.lock
          git push origin HEAD:main
  build:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: native
    strategy:
      fail-fast: false
      matrix:
        host: [bicboye, donkpad, smolboye, zippyrus]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # The out-link is a GC root, which keeps the build in the cache until the
      # next push replaces it.
      - name: Build ${{ matrix.host }}
        run: |
          mkdir -p /var/lib/gitea-runner/gcroots
          nix build ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" \
            --no-update-lock-file \
            --out-link "/var/lib/gitea-runner/gcroots/${{ matrix.host }}"
