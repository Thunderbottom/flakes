name: Update flake.lock
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
concurrency:
  group: flake-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: native
    timeout-minutes: 30
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          token: ${{ secrets.FLAKE_UPDATE_TOKEN }}
      - name: Update and validate flake inputs
        run: |
          set -euo pipefail
          nix flake update
          nix fmt -- --ci
          nix flake check --no-build
      - name: Publish update pull request
        env:
          TOKEN: ${{ secrets.FLAKE_UPDATE_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          nix develop .#ci --command bash scripts/ci-update.sh
  notify:
    if: ${{ failure() && !cancelled() }}
    needs: update
    runs-on: native
    timeout-minutes: 5
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Notify failure
        env:
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
        run: bash scripts/ci-notify.sh
